name: Plugin verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: python3 .github/check_plugin.py test

  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: python3 .github/check_plugin.py release-policy "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
